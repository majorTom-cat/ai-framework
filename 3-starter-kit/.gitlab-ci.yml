# CI — 골격판 (킷 템플릿) · 새 프로젝트에 그대로 복사해서 시작
# ⚠️ test·boundaries 는 스택(언어·테스트 러너·모듈 구조)이 확정되는 Day 0 이후 활성화한다.
#    지금은 스택 무관 게이트(tamper·high-risk·deploy 문법·AI 통신 확인)만 둔다.
#    → Charter/기술설계로 스택이 정해지면 아래 "스택 확정 후" 블록의 주석을 해제하고
#      <스택이미지>·<테스트명령>·<경계검사명령>을 채운다. (/scaffold 가 이 활성화를 돕는다)
stages:
  - test
  - gate
  - deploy

# ─────────────────────────────────────────────────────────
# 스택 확정(Day 0) 후 주석 해제 — 여기가 셀프머지의 핵심 게이트다
# ─────────────────────────────────────────────────────────
# test:
#   stage: test
#   image: <스택이미지>            # 예: node:20-alpine
#   script:
#     - <테스트명령>               # 예: npm ci && npm test
#   rules:
#     - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
#     - if: '$CI_COMMIT_BRANCH == "main"'
#
# boundaries:                       # 다른 모듈은 index로만 import (직접 내부 import = 빨간불)
#   stage: test
#   image: <스택이미지>
#   script:
#     - <경계검사명령>             # 기본: node scripts/check-boundaries.cjs (킷 동봉 — 상단 값 치환은 /scaffold)
#   rules:
#     - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
#     - if: '$CI_COMMIT_BRANCH == "main"'

# ─────────────────────────────────────────────────────────
# 스택 무관 게이트 — 지금부터 동작
# ─────────────────────────────────────────────────────────

# ── 가벼운 검사 묶음 ─────────────────────────────────────────────────────────
#   왜 묶나: 공용 러너는 동시 실행 자리가 한정돼 있다. 10~80초짜리 검사가 잡마다 자리를 따로 잡으면(파드 기동·
#     패키지 설치를 잡마다 되풀이) MR 둘만 겹쳐도 무거운 검사(test·build)가 그 뒤에 줄을 선다. 검사 «내용»은 그대로다.
#   묶는 기준 = 같은 이미지 · 같은 rules · 같은 차단 여부. 셋 중 하나라도 다르면 묶지 않는다 —
#     `allow_failure` 는 잡 단위라 경고형과 차단형을 섞으면 차단형 실패가 경고로 묻히거나 그 반대가 된다.
#     그래서 `secret-scan`(전용 이미지)·`changes:` 로 켜지는 잡(density-check·skill-size·ask-check·self-tests)은 따로 둔다.
#   본문은 `scripts/ci-job-<이름>.sh` 에 있고 실행기 `scripts/ci-run-checks.sh` 가 하나가 실패해도 **끝까지** 돈 뒤
#     로그 끝 «묶음 결과» 에 «실패: 이름…» 을 찍는다. 이름 오타는 실패(exit 2)다 — 검사가 조용히 빠지지 않는다.
#     배선(여기서 부르는 이름 ↔ `ci-job-*.sh` 실물 1:1)은 `scripts/test-ci-run-checks.sh` 가 지킨다.
#   `/scaffold` 가 가벼운 검사를 더하면 같은 기준으로 기존 묶음에 넣고, 기준이 다르면 새 묶음을 만든다.
#   되돌리기: 묶음 잡을 지우고 각 `ci-job-*.sh` 를 종전 이름의 잡 하나씩(`script: bash scripts/ci-job-<이름>.sh`)으로 되살린다.
#
# 경고형 묶음 — `allow_failure: true`: 실패해도 초록으로 보인다. **이 초록은 근거가 아니다**(CLAUDE.md '머지 등급').
#   · tamper-check — 테스트 변조 감지: src와 test(또는 CI설정)를 같은 MR에서 동시 수정 → 검토 필요.
#     정당한 테스트 삭제(기능 제거)도 걸리므로 막지 않고 보여준다.
#   · ai-connectivity — AI 리뷰 잡 전제: 사내 러너에서 api.anthropic.com 에 통신되나?(막히면 CI AI리뷰 잡 불가)
mr-warnings:
  stage: test
  image: alpine:3
  variables:
    # ★얕은 클론이면 origin/main 과의 merge base 가 없어 tamper-check 의 `git diff origin/main...HEAD` 가
    #   fatal 로 죽는다(검사 전체 실패 = 게이트 무효). density-check 와 같은 이유다.
    GIT_DEPTH: 0
  script:
    - apk add --no-cache bash git curl >/dev/null
    - bash scripts/ci-run-checks.sh tamper-check ai-connectivity
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# 밀도 검사 — 규칙 문서(CLAUDE.md·스킬)가 자기 밀도 규약을 지키나 (allow_failure=경고).
# 초과 줄을 매 MR마다 나열해 "추가만 하고 안 줄인다"를 상시 가시화한다. 근거: _reference/density.md
density-check:
  stage: test
  image: alpine:3
  variables:
    # ★얕은 클론이면 비교 기준 커밋이 없어 전수 검사로 떨어진다(=옛 줄까지 다 걸린다).
    GIT_DEPTH: 0
  script:
    - apk add --no-cache bash git >/dev/null
    # ★검사기 자체가 맞는지 먼저 본다 — bnsone 관례를 역이관했다(2026-09-07).
    #   self-tests 잡은 `changes: scripts/**` 라 **스킬만 고친 MR 에서는 안 돈다** — 그 MR 에서
    #   검사기가 깨져 있으면 무음으로 통과한다(bnsone #158 이 «바이트 계수»로 겪은 그 실패 유형).
    - bash scripts/test-check-density.sh
    - bash scripts/check-density.sh
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      # ★rules/ 도 검사 대상인데(줄당 500자) changes 에 없어서 rules 만 고친 MR 은 이 잡이 아예 안 돌았다.
      # ★검사기의 «자기테스트»도 트리거에 넣는다 — 그것만 고치는 MR 에서 잡이 안 뜨면
      #   그 변경만 검사 밖으로 샌다(bnsone #158 리뷰에서 온 관례).
      changes: [CLAUDE.md, ".claude/skills/**/*", ".claude/rules/**/*", scripts/check-density.sh, scripts/test-check-density.sh, scripts/check-skill-size.sh, scripts/test-check-skill-size.sh]

# 스킬 크기 검사 — ★차단한다(allow_failure 없음). 2026-09-09(저녁3) 오너 결정으로 density-check 에서 떼어냈다.
# 왜 차단인가: 컴팩션은 스킬마다 «앞 5,000토큰만 남기고 뒤를 자른다»(공식). 넘는 스킬은 대화가 길어지면
#   뒤쪽 절이 **조용히** 안 읽힌다 — 화면에 아무 신호가 없고, MR 의 ▶ 를 사람이 아무리 눌러도 안 보인다.
#   경고형으로 density-check(allow_failure=true) 안에 있던 동안 스킬 셋이 한도를 넘긴 채 머지됐고
#   `/done` 은 넘고 있다는 사실조차 아무도 몰랐다(2026-09-09 실측). 그래서 «사람 클릭» 대신 이 잡이 막는다.
skill-size:
  stage: test
  image: alpine:3
  script:
    - apk add --no-cache bash >/dev/null
    # ★검사기 자체가 맞는지 먼저 본다 — 검사기가 깨지면 지키던 것 전부가 무음 통과한다.
    - bash scripts/test-check-skill-size.sh
    - bash scripts/check-skill-size.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [".claude/skills/**/*", scripts/check-skill-size.sh, scripts/test-check-skill-size.sh]

# 확인 창 전수 검사 — ★차단한다(allow_failure 없음). 정본 목록 = `_reference/asks.md`
# 왜 차단인가: 훅이 내는 `ask` 는 **자동 모드보다 위라 모드가 못 건너뛴다** — 한 줄이 모든 세션·모든
#   모드에 정지 하나를 영구히 세운다. 그런데 2026-09-10 까지 «창이 몇 개인지» 아무도 안 셌고,
#   오너가 창을 찍어 보낼 때마다 하나씩 고쳤다(오너 「주먹구구식」). 표를 정본으로 두고 기계가 대조한다.
# ★검사기 자체가 맞는지 먼저 본다 — self-tests 잡은 `changes: scripts/**` 라 **훅만 고친 MR 에서는
#   안 돈다**. 그 MR 에서 검사기가 깨져 있으면 무음으로 통과한다.
ask-check:
  stage: test
  image: alpine:3
  script:
    - apk add --no-cache bash >/dev/null
    - bash scripts/test-check-asks.sh
    - bash scripts/check-asks.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [".claude/hooks/**/*", _reference/asks.md, scripts/check-asks.sh, scripts/test-check-asks.sh]

# MR 전용 차단형 묶음 — ★allow_failure 를 쓰지 않는다(묶는 이유는 위 `mr-warnings` 머리 주석).
#   · migration-immutable — 머지된 마이그레이션 불변 감시(삭제·수정·이름변경이면 빨간불).
#     왜: `git revert -m 1` 은 되돌리는 머지에 딸린 마이그레이션 폴더를 그냥 삭제한다(2026-08-06 리허설 실증).
#     CLAUDE.md '스키마·데이터'의 "main 에 머지된 파일은 불변"은 사람 규칙뿐이었고, 기본 도구의 기본 동작이
#     그 규칙을 깨는 쪽이라 사고가 조용히 지나간다(적용된 마이그레이션이 사라지면 드리프트).
#     되돌리는 정해진 길 = 파일은 되살려 두고(git checkout <머지커밋> -- <폴더>) 역DDL 을 담은 '새 마이그레이션'을
#     추가한다 → 그러면 diff 에 A 만 남아 통과한다(절차: _reference/revert.md B).
#     ※의도적 예외 통로를 두지 않았다 — 예외가 필요하면 그 스크립트를 고쳐야 하고, 그 변경은 high-risk-gate 를 탄다.
#     ※DB 없는 스택이면 DIR 경로가 없어 diff 0건 = 항상 통과(무해). 마이그레이션 도구 도입 시 `ci-job-migration-immutable.sh` 의 DIR 만 치환하라.
#   · append-only-check — 누적 파일(friction·CHANGELOG 류)의 «사라진 줄» 검사.
#     왜 차단인가: 이 검사기가 태어난 사고(2026-09-10 `!451` — 남의 마찰 줄 하나가 조용히 증발)의 원인은
#     «규칙을 안 지킨 것»이 아니라 **사람이 판정을 넘긴 것**이다. 처방을 「올리기 전에 사람이 돌려라」로만 두면
#     방어를 사고와 같은 층(사람의 기억)에 둔 것이라 같은 자리에서 또 무너진다.
#     CI 는 `git show origin/main:<파일>` 로 «지금의 main» 을 안다 — merge base 기준 = 놓침 · tip 기준 = 잡음(2026-09-16 픽스처 실측).
#   · deferred-check — «미룬 일»이 카드 번호 없이 문장으로만 남았나. 이 MR 이 «더한 줄»만 본다 — 옛 부채는 막지 않는다
#     (주기 점검 `--all` 로 따로 본다). 빠져나갈 길 = 조각마다 `(카드 불요: 사유)`.
#     왜 차단인가: 2026-09-17 bnsone 1차 요구 전수 대조에서 «후속 카드로·별도 카드·범위 밖(후속)»만 적고 안 생긴 일이
#     19건 나왔다. 사람 절차(/done 6단계)만 두면 같은 층에서 또 샌다.
#   ★changes: 를 걸지 않는다 — changes 는 '새 브랜치 첫 푸시에서 무조건 참'이라 조건부로 만들면 판정 유무가
#     브랜치 상태에 따라 흔들린다(_reference/ci-needs.md). 대상 파일을 안 건드린 MR 은 각 검사가 «0건»으로 몇 초에 통과한다.
#   ★검사기 자체가 맞는지 먼저 본다(각 `ci-job-*.sh` 앞머리) — self-tests 잡은 `changes: scripts/**` 라 대상 파일만 고친
#     MR 에서는 안 돈다. 그 MR 에서 검사기가 깨져 있으면 무음으로 통과한다.
mr-checks:
  stage: test
  image: python:3-alpine
  variables:
    # ★얕은 클론이면 대상 브랜치와의 merge base 가 없어 diff 가 성립하지 않는다(append-only 는 «판정 불능» exit 2 로 죽는다).
    GIT_DEPTH: 0
  script:
    - apk add --no-cache bash git >/dev/null
    - bash scripts/ci-run-checks.sh migration-immutable append-only-check deferred-check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# 검사기 자신의 회귀 테스트 — ★차단한다(allow_failure 없음).
# 왜 차단인가: 검사기가 깨지면 그 검사기가 지키던 것 전부가 **무음으로 통과**한다. 이 repo 가 반복해서
#   밟은 실패 유형이 정확히 그것이다(CI 이미지에 git 이 없어 훅 검사가 통째로 무음 → 초록 집계).
# ★scripts/test-*.sh 를 **찾아서 전부** 돈다 — 새 자기테스트가 생겨도 이 목록을 고칠 필요가 없다
#   (배포처가 자기 테스트를 더 갖고 있어도 그대로 잡힌다).
self-tests:
  stage: test
  image: alpine:3
  variables:
    GIT_DEPTH: 0
  script:
    # ★python3 — `scripts/*.py` 를 도는 자기테스트가 있다. 없으면 그 시험이 «검사기가 틀렸다»처럼 떨어진다(2026-09-10 배포처 CI 실측).
    # ★nodejs — `test-bundle-guard.sh` 가 `.cjs` 훅을 돈다. 없으면 «검증 불능»으로 떨어진다(합격으로 치지 않는다).
    - apk add --no-cache bash git python3 nodejs >/dev/null
    # 로컬 `/done` 3단계와 같은 스크립트 — 한 곳만 고치면 둘 다 바뀐다
    - bash scripts/run-self-tests.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ["scripts/**/*", ".claude/hooks/**/*"]

# ★needs 함정 — 배포 잡을 추가할 때 반드시 읽어라: `_reference/ci-needs.md`
#   needs가 rules(changes)로 빠질 수 있는 잡을 가리키면, 그 잡이 빠지는 커밋에서 GitLab이
#   파이프라인 생성 자체를 거부한다(잡 0개 = 시크릿 스캔·planner-guard 포함 전 게이트 무효).
#   bnsone 2026-07-31·08-03 실사고 8회. glab ci lint·dry_run 둘 다 통과하니 문법 검증으론 안 잡힌다.

# 시안(HTML) 자동 발행 — GitLab Pages (관리자가 서버에 Pages를 활성화한 경우 주석 해제)
# 활성화되면: docs/05_UIUX 가 바뀔 때마다 상시 URL로 발행 → 기획자는 링크 클릭만 (앱·스택 무관, 설계 단계부터 동작)
# pages:
#   stage: deploy
#   image: alpine:3
#   script:
#     - mkdir -p public && cp -r docs/05_UIUX/* public/ 2>/dev/null || echo "시안 없음"
#   artifacts:
#     paths: [public]
#   rules:
#     - if: '$CI_COMMIT_BRANCH == "main"'
#       changes: [docs/05_UIUX/**/*]

# 시크릿 스캔 — 커밋에 비밀값(키·암호·토큰)이 섞였는지 (발견 = 빨간불 차단)
# 러너가 docker hub에서 gitleaks 이미지를 못 받으면: 잡 로그로 확인 후 사내 미러 경로로 교체
secret-scan:
  stage: test
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-git --redact -v || (echo "⛔ 비밀값 의심 발견 — 커밋에서 제거하라. 이미 push됐으면 키 교체부터(공통 개발자 가이드 '사건 대응' 표)"; exit 1)
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# MR·main 공통 차단형 묶음 — ★allow_failure 를 쓰지 않는다(묶는 이유는 위 `mr-warnings` 머리 주석).
#   · planner-guard — 비개발자(기획/디자이너) 직접 push 안전망. CE엔 경로별 push 제한(CODEOWNERS·Push Rules)이 없어
#     '사후 감지'로 대체한다. CI/CD Variables 에 PLANNER_EMAILS 를 등록하면 발효(미등록이면 무해 통과).
#   · filename-nfc-check — 파일명 유니코드 정규화(NFC/NFD) 충돌 검사(같은 표시명의 파일 두 벌 — bnsone #85).
#     겹침만 차단, NFD 단독은 경고만.
#   ★main 에도 건다 — main 직접 push(기획자 docs 직접 push·최초 구축 예외)도 검사한다.
repo-guards:
  stage: test
  image: python:3-alpine
  variables:
    # 얕은 클론이면 push 범위(BEFORE..SHA)의 앞쪽 커밋이 없어 planner-guard 의 git log 가 실패한다 → 폴백으로 떨어져 감시 범위가 준다.
    GIT_DEPTH: 0
  script:
    - apk add --no-cache bash git >/dev/null
    - bash scripts/ci-run-checks.sh planner-guard filename-nfc-check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# 검수 서버 배포 — main 머지 시 자동 (실 배포 대상은 공통 개발자가 세팅, 지금은 문법·environment 등록만)
deploy-review:
  stage: deploy
  image: alpine:3
  script:
    - echo "검수 서버로 배포 - 커밋 $CI_COMMIT_SHORT_SHA"
    - echo "배포 후 /api/health 200 확인 (실 배포는 인프라 필요, 지금은 시뮬)"
  environment:
    name: review-server
    url: http://localhost:4321      # 실 배포 세팅 시 <검수서버URL>로 교체
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── 고위험 게이트 = 무료 티어의 경고 레인 강제 (manual gate) ───────────────────────
# 입구는 둘이다: 경로 기반(high-risk-gate)과 라벨 기반(high-risk-label-gate).
# 판정 로직은 아래 .peer-approval-gate 한 곳에만 둔다(두 입구가 같은 판정을 쓴다).
# ※ needs 를 쓰지 않는다 — needs 가 '안 만들어질 수 있는 잡'을 가리키면 파이프라인이 통째로
#   생성 거부된다(_reference/ci-needs.md 실사고). 게이트 잡은 서로 독립이어야 한다.
# ※ 선행 설정 2가지(/setup-gitlab 시점에 함께): ①CI 변수 GATE_API_TOKEN(read_api 토큰 — 없으면
#   작성자 판정이 커밋 author 폴백으로 떨어지고, author 메일≠GitLab 메일이면 셀프 승인이 **무음 통과**한다
#   = fail-open) ②라벨 `셀프승인` 생성(없으면 1인 상황의 고위험 MR 이 탈출구 없이 막힌다).
.peer-approval-gate:
  stage: gate
  image: alpine:3
  script:
    - apk add --no-cache curl jq >/dev/null
    # ※ 모든 echo 를 블록 스칼라(|) 안에 둔다 — 콜론+공백이 든 스칼라를 YAML 평문으로 두면
    #   문자열이 아니라 매핑으로 읽혀 설정 전체가 무효가 되고 잡 0개로 실패한다(파일럿 실측 #72).
    - |
      echo "고위험 변경 게이트 — 발동 사유: ${GATE_REASON:-미지정}"
      echo "경고 레인입니다 — AI 경고 리뷰 + 증적 3종을 남기고 본인이 이 잡을 실행합니다(동료 승인은 선택 · CLAUDE.md 머지 등급)."
      echo "본인이 실행하려면 MR 에 '셀프승인' 라벨을 붙이고 node scripts/mr-pipeline-refresh.cjs <MR번호> 를 돌리세요(라벨이 늦게 붙었을 때만 새 파이프라인을 만든다)."
      # ★안내 echo 만 있던 시절 = 게이트가 걸린 머지 24건 중 18건(75%)을 MR 작성자 본인이 눌렀고
      #  실 개발자 간 동료 승인은 0건이었다(2026-08-06 파일럿 전수 실측). GitLab CE 에는 '작성자
      #  승인 금지' 설정이 없다(projects/:id/approvals → 404 = Premium 기능). 그래서 잡이 직접 판정한다.
      PLAYER="${GITLAB_USER_LOGIN:-}"   # manual play 시 GitLab 은 잡의 user 를 '누른 사람'으로 갱신한다
      AUTHOR=""; SRC=""; SELF=0
      # ★MR 작성자를 주는 예정 변수는 없다 — GitLab 문서 'Predefined variables for merge request
      #  pipelines' 목록엔 CI_MERGE_REQUEST_ASSIGNEES·LABELS·TITLE·MILESTONE 은 있어도
      #  CI_MERGE_REQUEST_AUTHOR 가 없다(16.x·17.x). 그래서 ①API 조회(정본) ②커밋 author(폴백) 2단.
      if [ -n "${GATE_API_TOKEN:-}" ]; then
        AUTHOR=$(curl -sf --max-time 15 -H "PRIVATE-TOKEN: ${GATE_API_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_MERGE_REQUEST_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}" \
          | jq -r '.author.username // empty') || AUTHOR=""
        if [ -n "$AUTHOR" ]; then SRC="MR 작성자(API)"; fi
      fi
      if [ -n "$AUTHOR" ]; then
        if [ "$AUTHOR" = "$PLAYER" ]; then SELF=1; fi
      else
        # 폴백 — GATE_API_TOKEN 미등록/조회 실패. 파이프라인 커밋 author 와 실행자 메일을 비교한다.
        # 한계: '마지막 커밋 author' ≠ MR 작성자일 수 있다(공동작업·리베이스·체리픽) → 토큰을 등록하라.
        # (CI_JOB_TOKEN 으로는 안 된다 — 잡 토큰 허용 엔드포인트에 merge_requests 조회가 없다.)
        SRC="파이프라인 커밋 author(폴백 — GATE_API_TOKEN 미등록/조회실패)"
        AUTHOR="${CI_COMMIT_AUTHOR:-}"
        case "$AUTHOR" in *"<${GITLAB_USER_EMAIL:-__no_email__}>"*) SELF=1;; esac
      fi
      echo "실행자=${PLAYER:-(불명)} / 비교대상=${AUTHOR:-(불명)} [${SRC}]"
      # 셀프 승인 폴백 — MR 라벨 '셀프승인' 이 있으면 동일인도 통과시키되 로그에 남긴다.
      # ★이 잡이 보는 것은 라벨 존재뿐이다. 증적 3종(fresh-context AI 리뷰·diff 직접 확인·카드 댓글)은
      #  CLAUDE.md '머지 등급'과 /done 절차가 강제한다 — 라벨은 '규칙을 알고 택했다'는 표식이다.
      SELFOK=0
      case ",$(echo "${CI_MERGE_REQUEST_LABELS:-}" | tr -d ' ')," in *,셀프승인,*) SELFOK=1;; esac
      if [ "$SELF" = "1" ] && [ "$SELFOK" = "1" ]; then
        echo "✅ 본인 통과(경고 레인) — MR 라벨 '셀프승인' 확인. 증적 3종을 카드 댓글에 남겼는지 확인하세요."
        exit 0
      fi
      if [ "$SELF" = "1" ]; then
        echo "⛔ '셀프승인' 라벨이 없습니다 — 이 잡을 누른 사람(${PLAYER})이 변경 작성자와 같습니다."
        echo "   본인 통과가 표준 경로입니다(경고 레인). MR 에 '셀프승인' 라벨을 붙이고"
        echo "   node scripts/mr-pipeline-refresh.cjs <MR번호> 를 돌리세요 — MR 라벨은 파이프라인 생성 시점에 읽히므로"
        echo "   라벨만 붙이고 이 잡을 재실행해도 반영되지 않습니다. 그 스크립트가 새 파이프라인을 만들고 이 파이프라인은 취소합니다"
        echo "   (손으로 빈 커밋 push·Run pipeline 을 하면 같은 커밋에 두 벌이 돕니다)."
        exit 1
      fi
      if [ -z "$PLAYER" ]; then
        echo "⚠ 실행자 계정 미확인(GITLAB_USER_LOGIN 없음) — 동일인 판정 불가라 통과시킵니다(사람이 확인하세요)"
        exit 0
      fi
      echo "동료 승인 확인 — 통과"

# 경로 기반 입구 — 고위험 경로를 건드린 MR
# ★ CLAUDE.md '머지 등급'의 고위험 정의와 이 목록이 어긋나면 라벨만 달리고 승인 버튼이 없다(파일럿 3회 우회 실측).
# ★ 화면·기능 파일을 통째로 넣지 마라 — 게이트가 상시 켜지면 manual 승인이 형식이 되어 무의미해진다.
# ★ 이 목록은 '누락에 약하다' — 그 구멍은 아래 라벨 입구가 메운다.
high-risk-gate:
  extends: .peer-approval-gate
  variables:
    GATE_REASON: "고위험 경로 변경(shared·마이그레이션·의존성·lock 등)"
  rules:
    # ★2026-09-09(저녁3) 오너 결정 «되돌릴 수 있으면 묻지 마라» — ▶ 는 **git 으로 못 되돌리는 것에만** 남긴다.
    #   같은 날 낮에는 «방어선 자신(CLAUDE.md·.claude/**·.husky/** 등)» 까지 ▶ 로 세웠는데, 오너 판정은
    #   «사람이 그게 위험한지 구분이 안 된다 — 결국 매번 엔터를 누르는 것뿐이라 사실상 의미가 없다» 였다.
    #   실제로 그날 난 사고(스킬이 컴팩션 한도를 넘겨 뒤쪽이 안 읽힘)는 **▶ 를 아무리 눌러도 사람 눈엔
    #   안 보이는 종류**였고, 잡은 것은 사람이 아니라 검사기였다. 그래서 방어선은 «클릭»이 아니라
    #   «검사기»로 옮긴다(density-check 의 check-skill-size.sh 를 경고형 → 차단형으로 — 같은 커밋).
    #   ⚠️남는 것은 **머지 즉시 바깥 세상이 바뀌어 revert 로 못 되돌리는 것**뿐이다. 이 목록에 무언가를
    #   더하려면 «revert 커밋 하나로 원상복구되나?» 에 **아니오** 여야 한다 — 아니면 검사기로 만들어라.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &high-risk-hard
        - k8s/**/*                        # 배포 매니페스트 — 머지 즉시 클러스터 반영, 되돌릴 버튼이 없다
      when: manual
      allow_failure: false
    # ★2026-09-08 오너 결정: MR 에 `셀프승인` 라벨이 «파이프라인 생성 전에» 붙어 있으면 ▶ 없이 자동 실행된다.
    #   판정 스크립트는 그대로 돌아 «✅ 본인 통과(경고 레인)» 로그를 남긴다 — 승인의 실체는 증적 3종+라벨이고
    #   ▶ 클릭은 정보량 0 이었다(8/6 실측 게이트 24건 중 18건 본인 실행). 라벨 없는 MR 은 아래 manual 규칙(동료 레인) 그대로.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)셀프승인(,|$)/'
      # ⚠️`changes:` 목록 하나는 **50줄이 상한**이다 — 넘으면 GitLab 이 «has too many entries (maximum 50)» 로 설정 전체를
      #   무효로 본다(파이프라인이 안 만들어져 전 게이트가 꺼진다 · 자기시험은 그대로 초록). `/scaffold` 가 더하는 스택 경로도
      #   이 50줄에 든다 — 넘칠 것 같으면 글로브로 합쳐라. 줄 수는 `scripts/test-ci-changes-limit.sh` 가 센다.
      changes: &high-risk-paths
        - src/shared/**/*
        - db/migrations/**/*              # 스택 마이그레이션 경로로 치환 (Prisma 면 prisma/**/*)
        - "**/package.json"
        - "**/package-lock.json"
        # ★방어선 자신을 바꾸는 변경이 게이트를 안 타면 이중화(CI+AI규칙)가 무의미해진다 — 아래는 스택 무관.
        - CLAUDE.md                       # AI 팀 규칙 본문 — 방어선 자신 (로컬 훅과 1:1 이중화)
        - .gitlab-ci.yml                  # CI·게이트 설정 (게이트 자체를 무르게 하는 변경)
        - .gitlab/**/*                    # 이슈·MR 템플릿 등 GitLab 설정
        - .claude/**/*                    # AI 규칙 실물 — 스킬·rules·settings.json(권한·훅)·훅 스크립트 전부
        - .husky/**/*                     # git 훅 실물 — 한 줄 고치면 전원의 pre-push 검사가 영구히 꺼진다(2026-08-11 리뷰 B-1)
        - .gitattributes                  # 줄바꿈 규칙 — 깨지면 게이트 .sh 가 조용히 안 돈다
        # 훅 HITS 에만 있던 경로 — CI 도 같이 건다(훅↔CI 1:1).
        - Dockerfile
        - docker-compose.yml
        - docker-compose.yaml
        - "**/middleware.*"               # 인증·라우팅 입구(Next 16 은 proxy.*)
        - "**/proxy.*"
        - "**/yarn.lock"
        - "**/pnpm-lock.yaml"
        # ★게이트 스크립트만 명시한다 — `scripts/**/*` 전체를 걸면 스파이크·작업 코드까지
        #   매번 수동 승인이 걸려 승인이 도장찍기가 된다(파일럿 실측). `changes:`는 제외를 지원하지 않으니 열거가 유일한 방법.
        # ★2026-09-09: 이름 규약 글로브로 바꿨다 — 훅(`check-push.sh` HITS)은 `scripts/(check|test|notify|extract)-*`
        #   전부를 잡는데 CI 는 3개만 열거해, 킷 스크립트 10개 중 7개(자기테스트 4개 포함)를 무르게 하는 MR 이
        #   게이트 없이 머지됐다. 훅 주석이 선언한 «CI 와 1:1» 이 킷 자신에서 거짓이었다(2026-09-09 감사).
        - scripts/check-*.sh
        - scripts/check-*.cjs
        - scripts/test-*.sh
        - scripts/test-*.cjs
        - scripts/notify-*.sh
        - scripts/notify-*.cjs
        - scripts/extract-*.sh
        - scripts/extract-*.cjs
        # ★훅은 .ts·.py 도 잡는데 CI 만 빠져 있었다 — `check-append-only.py` 를 무르게 하는 MR 이 게이트 밖이었다(2026-09-29).
        - scripts/check-*.ts
        - scripts/check-*.py
        - scripts/test-*.ts
        - scripts/test-*.py
        - scripts/notify-*.ts
        - scripts/notify-*.py
        - scripts/extract-*.ts
        - scripts/extract-*.py
        - scripts/run-self-tests.sh       # 이름 규약 밖이지만 차단형 `self-tests` 잡이 직접 부른다 — 빈 루프로 바꾸면 전부 초록
        - scripts/pipeline-verdict.cjs    # 머지 판정 근거 — 느슨해지면 «종결초록» 오판으로 머지된다
        - scripts/mr-pipeline-refresh.cjs # 게이트 절차가 부른다 — 파이프라인을 만들고 «취소»한다
        - scripts/ci-*.sh                 # 검사 묶음 실행기·잡 본문(ci-run-checks·ci-job-*) — 빈 본문으로 바꾸면 묶음이 초록
        - scripts/gen-module.cjs          # 모듈 생성기 = 새 모듈의 골격을 정한다
        - test/*.test.js                  # 경계 검사기 회귀 테스트
        # ⚠️이름 규약 밖 스크립트를 차단형 잡이 직접 부르게 했으면 여기와 훅 HITS 양쪽에 더하라(배포처 예: soak-int-tests.sh).
        # ↑ 스택 무관 고위험 경로. /scaffold가 스택 확정 후 인증·라우팅·설정 경로(라우팅 파일은 스택마다 위치가 다르다)를 여기 추가한다.
        #   경로로 못 잡는 고위험(모듈 내부 인증·결제 로직 등)은 `고위험` 라벨 + /done이 사람 승인으로 막는다 — 라벨이 정본.
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *high-risk-paths
      when: manual
      allow_failure: false

# 라벨 기반 입구 — '고위험' 라벨이 붙은 MR 이면 경로와 무관하게 게이트가 성립한다.
# ★왜 필요한가: 게이트를 유발한 파일을 MR 도중 되돌리면 최종 파이프라인에서 경로 기반 잡이 소멸한 채
#   머지된다(파일럿 !113 실측). `changes:` 는 '지금 diff 에 그 파일이 있나'만 보므로, 라벨은 사람이 붙인
#   '이 변경은 고위험' 판단이라 diff 로 지워지지 않는다. /done 7단계가 고위험 MR 에 `--label 고위험`을 강제한다.
# ※경로 입구와 동시 발동하면 manual 버튼이 2개 뜬다 — 무해하다(둘 다 같은 판정, 둘 다 눌러야 머지).
# ※한계: MR 라벨은 파이프라인 생성 시점에 읽힌다. 라벨을 나중에 붙였으면 새 파이프라인을 돌려야 잡이 생긴다
#   — `node scripts/mr-pipeline-refresh.cjs <MR번호>` 가 «늦게 붙었을 때만» 만들고 같은 커밋의 앞 것을 취소한다.
#   이 잡·위 `high-risk-gate` 가 읽는 라벨 이름을 바꾸면 그 스크립트의 GATE_LABELS 도 함께(`test-mr-pipeline-refresh.sh` ⑤가 대조).
#   한글 라벨의 RE2 매칭은 실 파이프라인 실측 전 — 첫 고위험 MR 에서 잡 생성을 눈으로 확인하라(/done 7단계).
high-risk-label-gate:
  extends: .peer-approval-gate
  variables:
    GATE_REASON: "MR 에 '고위험' 라벨이 붙어 있음(경로 목록과 무관)"
  rules:
    # ★2026-09-09 오너 결정 «위험한 것만 묻기» — `고위험` 라벨은 «경로로 못 잡는 위험»(인증·결제 로직)이
    #   붙는 자리다. 그 정의상 되돌리기 어려운 쪽이므로 셀프승인 라벨로도 자동 통과시키지 않는다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /고위험/'
      when: manual
      allow_failure: false
