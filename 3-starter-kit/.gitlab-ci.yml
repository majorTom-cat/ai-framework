# CI — 골격판 (킷 템플릿) · 새 프로젝트에 그대로 복사해서 시작
# ⚠️ test·boundaries 는 스택(언어·테스트 러너·모듈 구조)이 확정되는 Day 0 이후 활성화한다.
#    지금은 스택 무관 게이트(tamper·high-risk·deploy 문법·AI 통신 확인)만 둔다.
#    → Charter/기술설계로 스택이 정해지면 아래 "스택 확정 후" 블록의 주석을 해제하고
#      <스택이미지>·<테스트명령>·<경계검사명령>을 채운다. (/scaffold 가 이 활성화를 돕는다)
stages:
  - test
  - gate
  - deploy

# ─────────────────────────────────────────────────────────
# 스택 확정(Day 0) 후 주석 해제 — 여기가 셀프머지의 핵심 게이트다
# ─────────────────────────────────────────────────────────
# test:
#   stage: test
#   image: <스택이미지>            # 예: node:20-alpine
#   script:
#     - <테스트명령>               # 예: npm ci && npm test
#   rules:
#     - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
#     - if: '$CI_COMMIT_BRANCH == "main"'
#
# boundaries:                       # 다른 모듈은 index로만 import (직접 내부 import = 빨간불)
#   stage: test
#   image: <스택이미지>
#   script:
#     - <경계검사명령>             # 기본: node scripts/check-boundaries.cjs (킷 동봉 — 상단 값 치환은 /scaffold)
#   rules:
#     - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
#     - if: '$CI_COMMIT_BRANCH == "main"'

# ─────────────────────────────────────────────────────────
# 스택 무관 게이트 — 지금부터 동작
# ─────────────────────────────────────────────────────────

# AI 리뷰 잡 전제: 사내 러너에서 api.anthropic.com 에 통신되나? (막히면 CI AI리뷰 잡 불가)
ai-connectivity:
  stage: test
  image: alpine:3
  script:
    - apk add --no-cache curl >/dev/null
    - |
      CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -X POST \
        -H "content-type: application/json" -d '{}' \
        https://api.anthropic.com/v1/messages || echo "000")
      echo "api.anthropic.com 응답: $CODE  (4xx=통신 성공(인증만 실패) / 000=방화벽 차단)"
      case "$CODE" in
        4*) echo "OK — 필요 시 AI 리뷰 잡을 사내 러너에서 돌릴 수 있다";;
        *)  echo "차단 — 러너 아웃바운드 방화벽/프록시 확인 필요";;
      esac
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# 테스트 변조 감지: src와 test(또는 CI설정)를 같은 MR에서 동시 수정 → 검토 필요
tamper-check:
  stage: test
  image: alpine:3
  variables:
    # ★얕은 클론이면 origin/main 과의 merge base 가 없어 `git diff origin/main...HEAD` 가
    #   fatal 로 죽는다(잡 전체 실패 = 게이트 무효). density-check 와 같은 이유다.
    GIT_DEPTH: 0
  script:
    - apk add --no-cache git >/dev/null
    - git fetch -q origin main
    - CH=$(git diff --name-only origin/main...HEAD)
    - echo "변경 파일:"; echo "$CH"
    - |
      # 테스트 감지는 파일명 기준 — 테스트가 src 안에 코로케이션되는 스택(Vitest 등)에서도 걸리게 (bnsone 실측 2026-07-29: '^test/'만으로는 src/**/*.test.ts가 영원히 미매칭)
      # ★소스·테스트·CI설정을 서로 다른 축으로 분류한다. 예전엔 '^src/ 매칭 && 테스트 매칭'이라
      #   src/foo.test.ts 한 파일이 두 조건을 혼자 만족시켜 평범한 TDD MR마다 경고가 떴다
      #   (오탐 실측 2026-07-29 · 파일럿 #72). 오탐이 반복되면 경고가 무시되어 진짜 변조를 놓친다.
      #   판정 논리 정본 = 파일럿 scripts/tamper-check.sh (테스트가 붙어 있는 파일판).
      TEST_RE='\.test\.|\.spec\.|(^|/)tests?/|(^|/)__tests__/'
      CI_RE='(^|/)\.gitlab-ci\.yml$|(^|/)\.gitlab/'
      TESTS=$(echo "$CH" | grep -E "$TEST_RE" || true)
      CICONF=$(echo "$CH" | grep -E "$CI_RE" | grep -vE "$TEST_RE" || true)
      # 소스 = 테스트가 아닌 src 파일. 스택별 루트 소스(server.js·middleware.ts 등)는 /scaffold 가 여기 추가한다.
      SRCS=$(echo "$CH" | grep -E '^src/' | grep -vE "$TEST_RE" || true)
      # ★수집 설정 — 소스도 테스트도 아닌 사각지대(2026-08-26 신설). include 를 줄이면 **테스트 파일을
      #   한 줄도 안 고치고 전부 끌 수 있다**. 스택마다 이름이 다르니 /scaffold 가 이 목록을 치환한다.
      CFG_RE='(^|/)(vitest\.config\.[a-z]+|vitest\.workspace\.[a-z]+|jest\.config\.[a-z]+|package\.json)$'
      CFG=$(echo "$CH" | grep -E "$CFG_RE" || true)
      # ★2026-08-26 개정 — 두 층으로 나눈다(오너 결정).
      #   ⓘ알림(NOTE, 통과): '동시 수정' 조합. 이건 우리 표준 작업 방식이기도 해서 빨간불로 두면
      #      상시 실패가 된다(bnsone 실측: 최근 23건 중 14건 실패 → 아무도 안 봄 = 진짜 변조도 놓침).
      #   ⛔의심(SUSPECT, 실패): 테스트 무력화 신호. 이쪽이 훨씬 정확하고, 지금까진 '소스를 안 건드린
      #      경우'에만 돌아서 소스와 함께 테스트를 끄는 형태를 아예 못 봤다 — 그 공백도 함께 메운다.
      NOTE=0
      SUSPECT=0
      # ⓪수집 설정 변경 — 수집 범위·테스트 명령이 바뀌면 의심(버전 올림 같은 무관한 변경은 안 걸린다)
      if [ -n "$CFG" ]; then
        CFGHIT=$(git --literal-pathspecs diff --no-renames --unified=0 origin/main...HEAD -- $CFG \
          | grep -E '^[-+]' | grep -vE '^(\+\+\+|---)' \
          | grep -E 'include|exclude|testMatch|testPathIgnorePatterns|setupFiles|coverage|threshold|"test"[[:space:]]*:' || true)
        if [ -n "$CFGHIT" ]; then
          echo "⛔ 테스트 수집 설정이 바뀌었다 — 수집 범위를 줄여 테스트를 통째로 끈 게 아닌지 검토"
          echo "$CFGHIT" | head -10
          SUSPECT=1
        fi
      fi
      if [ -n "$SRCS" ] && [ -n "$TESTS" ]; then
        echo "ⓘ 소스와 테스트 동시 수정(정상 작업일 수 있음 — 기록만)"
        echo "  소스:"; echo "$SRCS" | sed 's/^/    /'
        echo "  테스트:"; echo "$TESTS" | sed 's/^/    /'
        NOTE=1
      fi
      # CI설정은 테스트와 별개 축으로 센다 — 한 덩어리로 세면 CI만 고쳐도 '테스트 동시 수정'으로 오탐난다.
      if [ -n "$CICONF" ] && [ -n "$TESTS" ]; then
        echo "ⓘ CI설정과 테스트 동시 수정(기록만) — 게이트를 무르게 하며 테스트를 고친 게 아닌지는 리뷰가 본다"
        NOTE=1
      fi
      if [ -n "$SRCS" ] && [ -n "$CICONF" ]; then
        echo "ⓘ 소스와 CI설정 동시 수정(기록만)"
        NOTE=1
      fi
      # ⛔무력화 감지 — 테스트 파일이 바뀌었으면 **항상** 본다.
      #   ·skip/only/todo 추가 = 어떤 경우든 의심(테스트를 끄는 행위 자체)
      #   ·줄 삭제 = 소스·CI를 안 건드린 '테스트만 변경'일 때만 의심(리팩터링 중 줄 삭제는 정상)
      #   테스트 '추가·보강'은 조용히 통과시킨다. ※공백 든 파일명은 파일럿 scripts/tamper-check.sh 판이 안전하다.
      if [ -n "$TESTS" ]; then
        DIFF=$(git --literal-pathspecs diff --no-renames --unified=0 origin/main...HEAD -- $TESTS)
        DEL=$(echo "$DIFF" | grep -E '^-' | grep -vE '^--- ' || true)
        # skipIf(true)·runIf(false) 포함 — 조건을 상수로 박아 끄는 우회(조건부 자체는 관용구라 제외)
        OFF=$(echo "$DIFF" | grep -E '^\+' | grep -vE '^\+\+\+ ' | grep -E '(^|[^A-Za-z0-9_])(it|test|describe)(\.[A-Za-z]+)*\.(skip|only|todo|failing)[[:space:]]*[(<`.]|(^|[^A-Za-z0-9_])x(it|test|describe)[[:space:]]*\(|\.(skipIf[[:space:]]*\([[:space:]]*true|runIf[[:space:]]*\([[:space:]]*false)' || true)
        # 테스트 케이스 '순감소' — 제목 수정처럼 선언 1줄을 지우고 1줄 추가하는 것까지 걸리면 또 상시 경고가
        # 된다. 그래서 삭제 선언 수 > 추가 선언 수일 때만 본다(파일을 test/ 밖으로 옮겨 없애는 은닉이 이 형태).
        CASE_RE='(^|[^A-Za-z0-9_])(it|test|describe)(\.[A-Za-z]+)*[[:space:]]*[(<`]'
        DEL_CASES=$(echo "$DIFF" | grep -E '^-' | grep -vE '^--- ' | grep -cE "$CASE_RE" || true)
        ADD_CASES=$(echo "$DIFF" | grep -E '^\+' | grep -vE '^\+\+\+ ' | grep -cE "$CASE_RE" || true)
        if [ -n "$OFF" ]; then
          echo "⛔ 테스트에 skip/only/todo 추가 — 테스트 무력화가 아닌지 검토"
          SUSPECT=1
        fi
        if [ "$DEL_CASES" -gt "$ADD_CASES" ]; then
          echo "⛔ 테스트 케이스가 순감소했다 — 무력화·은닉이 아닌지 검토 (선언 삭제 $DEL_CASES · 추가 $ADD_CASES)"
          SUSPECT=1
        elif [ -z "$SRCS" ] && [ -z "$CICONF" ] && [ -n "$DEL" ]; then
          # 케이스 수는 그대로인데 줄만 지워진 것 = 단언 삭제이거나 리팩터링. 파일 규칙으로는 못 가르므로
          # 알림으로 남긴다(실질 판정은 /done 리뷰). 실패로 두면 테스트 정리 때마다 빨간불이라 원위치다.
          echo "ⓘ 테스트만 변경됐고 줄 삭제가 있다(케이스 수는 유지 — 기록만)"
          NOTE=1
        fi
      fi
      if [ "$SUSPECT" = "1" ]; then exit 1; fi
      if [ "$NOTE" = "1" ]; then echo "동시 수정 알림만 — 무력화 신호 없음 · OK"; else echo "변조 의심 조합 아님 — OK"; fi
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# 밀도 검사 — 규칙 문서(CLAUDE.md·스킬)가 자기 밀도 규약을 지키나 (allow_failure=경고).
# 초과 줄을 매 MR마다 나열해 "추가만 하고 안 줄인다"를 상시 가시화한다. 근거: _reference/density.md
density-check:
  stage: test
  image: alpine:3
  variables:
    # ★얕은 클론이면 비교 기준 커밋이 없어 전수 검사로 떨어진다(=옛 줄까지 다 걸린다).
    GIT_DEPTH: 0
  script:
    - apk add --no-cache bash git >/dev/null
    - bash scripts/check-density.sh
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      # ★rules/ 도 검사 대상인데(줄당 500자) changes 에 없어서 rules 만 고친 MR 은 이 잡이 아예 안 돌았다.
      changes: [CLAUDE.md, ".claude/skills/**/*", ".claude/rules/**/*", scripts/check-density.sh]

# 검사기 자신의 회귀 테스트 — ★차단한다(allow_failure 없음).
# 왜 차단인가: 검사기가 깨지면 그 검사기가 지키던 것 전부가 **무음으로 통과**한다. 이 repo 가 반복해서
#   밟은 실패 유형이 정확히 그것이다(CI 이미지에 git 이 없어 훅 검사가 통째로 무음 → 초록 집계).
# ★scripts/test-*.sh 를 **찾아서 전부** 돈다 — 새 자기테스트가 생겨도 이 목록을 고칠 필요가 없다
#   (배포처가 자기 테스트를 더 갖고 있어도 그대로 잡힌다).
self-tests:
  stage: test
  image: alpine:3
  variables:
    GIT_DEPTH: 0
  script:
    - apk add --no-cache bash git >/dev/null
    - |
      RC=0
      for t in scripts/test-*.sh; do
        [ -f "$t" ] || continue
        echo "════════ $t"
        bash "$t" || RC=1
      done
      [ "$RC" = 0 ] && echo "자기테스트 전부 통과" || echo "⛔ 위에서 실패한 자기테스트가 있다"
      exit $RC
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ["scripts/**/*", ".claude/hooks/**/*"]

# ★needs 함정 — 배포 잡을 추가할 때 반드시 읽어라: `_reference/ci-needs.md`
#   needs가 rules(changes)로 빠질 수 있는 잡을 가리키면, 그 잡이 빠지는 커밋에서 GitLab이
#   파이프라인 생성 자체를 거부한다(잡 0개 = 시크릿 스캔·planner-guard 포함 전 게이트 무효).
#   bnsone 2026-07-31·08-03 실사고 8회. glab ci lint·dry_run 둘 다 통과하니 문법 검증으론 안 잡힌다.

# 시안(HTML) 자동 발행 — GitLab Pages (관리자가 서버에 Pages를 활성화한 경우 주석 해제)
# 활성화되면: docs/05_UIUX 가 바뀔 때마다 상시 URL로 발행 → 기획자는 링크 클릭만 (앱·스택 무관, 설계 단계부터 동작)
# pages:
#   stage: deploy
#   image: alpine:3
#   script:
#     - mkdir -p public && cp -r docs/05_UIUX/* public/ 2>/dev/null || echo "시안 없음"
#   artifacts:
#     paths: [public]
#   rules:
#     - if: '$CI_COMMIT_BRANCH == "main"'
#       changes: [docs/05_UIUX/**/*]

# 시크릿 스캔 — 커밋에 비밀값(키·암호·토큰)이 섞였는지 (발견 = 빨간불 차단)
# 러너가 docker hub에서 gitleaks 이미지를 못 받으면: 잡 로그로 확인 후 사내 미러 경로로 교체
secret-scan:
  stage: test
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-git --redact -v || (echo "⛔ 비밀값 의심 발견 — 커밋에서 제거하라. 이미 push됐으면 키 교체부터(공통 개발자 가이드 '사건 대응' 표)"; exit 1)
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# 파일명 유니코드 정규화(NFC/NFD) 충돌 검사 — 기획자 웹 업로드(대개 NFC)와 맥 로컬 git add(NFD)가
# **같은 표시명의 파일을 두 벌** 만든 실사고 방지(bnsone #85 — 이틀 잠복, 눈·grep·기존 CI 전부 못 잡음:
# 화면엔 한 파일로 보이고 grep 패턴은 한쪽 인코딩만 친다). 검사는 체크아웃 트리 전수(= 그 커밋의 추적 파일).
# ★차단은 "정규화하면 같은 경로가 되는 실물 두 벌"만 — 이 겹침은 항상 진짜 중복이라 오탐이 없다.
#   NFD 단독 존재(겹침 없음)는 경고만 낸다 — 맥 git 설정에 따라 정상 작업에서도 나올 수 있어 차단하면 오탐.
filename-nfc-check:
  stage: test
  image: python:3-alpine
  script:
    - |
      python3 - <<'PY'
      import os, sys, unicodedata
      seen, dups, nfd = {}, [], []
      for root, dirs, files in os.walk('.'):
          dirs[:] = [d for d in dirs if d != '.git']
          for f in files:
              p = os.path.relpath(os.path.join(root, f), '.')
              key = unicodedata.normalize('NFC', p)
              if p != key:
                  nfd.append(p)
              if key in seen and seen[key] != p:
                  dups.append((seen[key], p))
              else:
                  seen[key] = p
      if nfd and not dups:
          print(f"주의: NFD 인코딩 파일명 {len(nfd)}건(겹침 없음 — 통과). 맥에서 git config core.precomposeunicode true 권장:")
          for p in nfd[:10]: print("  -", p)
      if dups:
          print("⛔ 같은 표시명의 파일이 두 벌 있습니다 — 유니코드 정규화(NFC/NFD) 충돌:")
          for a, b in dups:
              print(f"  · {a!r} ↔ {b!r}  (화면·grep에는 하나로 보입니다)")
          print("고치기: 두 벌의 내용을 대조해 최신 쪽만 남기고, 남길 파일 이름을 NFC로 통일(git mv). 경위는 bnsone #85 참조.")
          sys.exit(1)
      print(f"파일명 정규화 충돌 0건 (검사 {len(seen)}개)")
      PY
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# 검수 서버 배포 — main 머지 시 자동 (실 배포 대상은 공통 개발자가 세팅, 지금은 문법·environment 등록만)
deploy-review:
  stage: deploy
  image: alpine:3
  script:
    - echo "검수 서버로 배포 - 커밋 $CI_COMMIT_SHORT_SHA"
    - echo "배포 후 /api/health 200 확인 (실 배포는 인프라 필요, 지금은 시뮬)"
  environment:
    name: review-server
    url: http://localhost:4321      # 실 배포 세팅 시 <검수서버URL>로 교체
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── 고위험 게이트 = 무료 티어의 경고 레인 강제 (manual gate) ───────────────────────
# 입구는 둘이다: 경로 기반(high-risk-gate)과 라벨 기반(high-risk-label-gate).
# 판정 로직은 아래 .peer-approval-gate 한 곳에만 둔다(두 입구가 같은 판정을 쓴다).
# ※ needs 를 쓰지 않는다 — needs 가 '안 만들어질 수 있는 잡'을 가리키면 파이프라인이 통째로
#   생성 거부된다(_reference/ci-needs.md 실사고). 게이트 잡은 서로 독립이어야 한다.
# ※ 선행 설정 2가지(/setup-gitlab 시점에 함께): ①CI 변수 GATE_API_TOKEN(read_api 토큰 — 없으면
#   작성자 판정이 커밋 author 폴백으로 떨어지고, author 메일≠GitLab 메일이면 셀프 승인이 **무음 통과**한다
#   = fail-open) ②라벨 `셀프승인` 생성(없으면 1인 상황의 고위험 MR 이 탈출구 없이 막힌다).
.peer-approval-gate:
  stage: gate
  image: alpine:3
  script:
    - apk add --no-cache curl jq >/dev/null
    # ※ 모든 echo 를 블록 스칼라(|) 안에 둔다 — 콜론+공백이 든 스칼라를 YAML 평문으로 두면
    #   문자열이 아니라 매핑으로 읽혀 설정 전체가 무효가 되고 잡 0개로 실패한다(파일럿 실측 #72).
    - |
      echo "고위험 변경 게이트 — 발동 사유: ${GATE_REASON:-미지정}"
      echo "경고 레인입니다 — AI 경고 리뷰 + 증적 3종을 남기고 본인이 이 잡을 실행합니다(동료 승인은 선택 · CLAUDE.md 머지 등급)."
      echo "본인이 실행하려면 MR 에 '셀프승인' 라벨을 붙이고 ★새 파이프라인을 돌린 뒤 이 잡을 실행하세요."
      # ★안내 echo 만 있던 시절 = 게이트가 걸린 머지 24건 중 18건(75%)을 MR 작성자 본인이 눌렀고
      #  실 개발자 간 동료 승인은 0건이었다(2026-08-06 파일럿 전수 실측). GitLab CE 에는 '작성자
      #  승인 금지' 설정이 없다(projects/:id/approvals → 404 = Premium 기능). 그래서 잡이 직접 판정한다.
      PLAYER="${GITLAB_USER_LOGIN:-}"   # manual play 시 GitLab 은 잡의 user 를 '누른 사람'으로 갱신한다
      AUTHOR=""; SRC=""; SELF=0
      # ★MR 작성자를 주는 예정 변수는 없다 — GitLab 문서 'Predefined variables for merge request
      #  pipelines' 목록엔 CI_MERGE_REQUEST_ASSIGNEES·LABELS·TITLE·MILESTONE 은 있어도
      #  CI_MERGE_REQUEST_AUTHOR 가 없다(16.x·17.x). 그래서 ①API 조회(정본) ②커밋 author(폴백) 2단.
      if [ -n "${GATE_API_TOKEN:-}" ]; then
        AUTHOR=$(curl -sf --max-time 15 -H "PRIVATE-TOKEN: ${GATE_API_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_MERGE_REQUEST_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}" \
          | jq -r '.author.username // empty') || AUTHOR=""
        if [ -n "$AUTHOR" ]; then SRC="MR 작성자(API)"; fi
      fi
      if [ -n "$AUTHOR" ]; then
        if [ "$AUTHOR" = "$PLAYER" ]; then SELF=1; fi
      else
        # 폴백 — GATE_API_TOKEN 미등록/조회 실패. 파이프라인 커밋 author 와 실행자 메일을 비교한다.
        # 한계: '마지막 커밋 author' ≠ MR 작성자일 수 있다(공동작업·리베이스·체리픽) → 토큰을 등록하라.
        # (CI_JOB_TOKEN 으로는 안 된다 — 잡 토큰 허용 엔드포인트에 merge_requests 조회가 없다.)
        SRC="파이프라인 커밋 author(폴백 — GATE_API_TOKEN 미등록/조회실패)"
        AUTHOR="${CI_COMMIT_AUTHOR:-}"
        case "$AUTHOR" in *"<${GITLAB_USER_EMAIL:-__no_email__}>"*) SELF=1;; esac
      fi
      echo "실행자=${PLAYER:-(불명)} / 비교대상=${AUTHOR:-(불명)} [${SRC}]"
      # 셀프 승인 폴백 — MR 라벨 '셀프승인' 이 있으면 동일인도 통과시키되 로그에 남긴다.
      # ★이 잡이 보는 것은 라벨 존재뿐이다. 증적 3종(fresh-context AI 리뷰·diff 직접 확인·카드 댓글)은
      #  CLAUDE.md '머지 등급'과 /done 절차가 강제한다 — 라벨은 '규칙을 알고 택했다'는 표식이다.
      SELFOK=0
      case ",$(echo "${CI_MERGE_REQUEST_LABELS:-}" | tr -d ' ')," in *,셀프승인,*) SELFOK=1;; esac
      if [ "$SELF" = "1" ] && [ "$SELFOK" = "1" ]; then
        echo "✅ 본인 통과(경고 레인) — MR 라벨 '셀프승인' 확인. 증적 3종을 카드 댓글에 남겼는지 확인하세요."
        exit 0
      fi
      if [ "$SELF" = "1" ]; then
        echo "⛔ '셀프승인' 라벨이 없습니다 — 이 잡을 누른 사람(${PLAYER})이 변경 작성자와 같습니다."
        echo "   본인 통과가 표준 경로입니다(경고 레인). MR 에 '셀프승인' 라벨을 붙이고"
        echo "   ★새 파이프라인을 돌린 뒤 이 잡을 실행하세요 — MR 라벨은 파이프라인 생성 시점에 읽히므로"
        echo "   라벨만 붙이고 이 잡을 재실행해도 반영되지 않습니다(빈 커밋 push 또는 Run pipeline)."
        exit 1
      fi
      if [ -z "$PLAYER" ]; then
        echo "⚠ 실행자 계정 미확인(GITLAB_USER_LOGIN 없음) — 동일인 판정 불가라 통과시킵니다(사람이 확인하세요)"
        exit 0
      fi
      echo "동료 승인 확인 — 통과"

# 경로 기반 입구 — 고위험 경로를 건드린 MR
# ★ CLAUDE.md '머지 등급'의 고위험 정의와 이 목록이 어긋나면 라벨만 달리고 승인 버튼이 없다(파일럿 3회 우회 실측).
# ★ 화면·기능 파일을 통째로 넣지 마라 — 게이트가 상시 켜지면 manual 승인이 형식이 되어 무의미해진다.
# ★ 이 목록은 '누락에 약하다' — 그 구멍은 아래 라벨 입구가 메운다.
high-risk-gate:
  extends: .peer-approval-gate
  variables:
    GATE_REASON: "고위험 경로 변경(shared·마이그레이션·의존성·lock 등)"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/shared/**/*
        - db/migrations/**/*              # 스택 마이그레이션 경로로 치환 (Prisma 면 prisma/**/*)
        - "**/package.json"
        - "**/package-lock.json"
        # ★방어선 자신을 바꾸는 변경이 게이트를 안 타면 이중화(CI+AI규칙)가 무의미해진다 — 아래는 스택 무관.
        - CLAUDE.md                       # AI 팀 규칙 본문 — 방어선 자신 (로컬 훅과 1:1 이중화)
        - .gitlab-ci.yml                  # CI·게이트 설정 (게이트 자체를 무르게 하는 변경)
        - .gitlab/**/*                    # 이슈·MR 템플릿 등 GitLab 설정
        - .claude/**/*                    # AI 규칙 실물 — 스킬·rules·settings.json(권한·훅)·훅 스크립트 전부
        - .husky/**/*                     # git 훅 실물 — 한 줄 고치면 전원의 pre-push 검사가 영구히 꺼진다(2026-08-11 리뷰 B-1)
        - .gitattributes                  # 줄바꿈 규칙 — 깨지면 게이트 .sh 가 조용히 안 돈다
        # ★게이트 스크립트만 명시한다 — `scripts/**/*` 전체를 걸면 스파이크·작업 코드까지
        #   매번 수동 승인이 걸려 승인이 도장찍기가 된다(파일럿 실측). `changes:`는 제외를 지원하지 않으니 열거가 유일한 방법.
        - scripts/check-boundaries.cjs    # 모듈 경계 검사 = CI 게이트 실물
        - scripts/check-density.sh        # 밀도 검사 = CI 게이트 실물
        - scripts/gen-module.cjs          # 모듈 생성기 = 새 모듈의 골격을 정한다
        # ↑ 스택 무관 고위험 경로. /scaffold가 스택 확정 후 인증·라우팅·설정 경로(라우팅 파일은 스택마다 위치가 다르다)를 여기 추가한다.
        #   경로로 못 잡는 고위험(모듈 내부 인증·결제 로직 등)은 `고위험` 라벨 + /done이 사람 승인으로 막는다 — 라벨이 정본.
      when: manual
      allow_failure: false

# 라벨 기반 입구 — '고위험' 라벨이 붙은 MR 이면 경로와 무관하게 게이트가 성립한다.
# ★왜 필요한가: 게이트를 유발한 파일을 MR 도중 되돌리면 최종 파이프라인에서 경로 기반 잡이 소멸한 채
#   머지된다(파일럿 !113 실측). `changes:` 는 '지금 diff 에 그 파일이 있나'만 보므로, 라벨은 사람이 붙인
#   '이 변경은 고위험' 판단이라 diff 로 지워지지 않는다. /done 7단계가 고위험 MR 에 `--label 고위험`을 강제한다.
# ※경로 입구와 동시 발동하면 manual 버튼이 2개 뜬다 — 무해하다(둘 다 같은 판정, 둘 다 눌러야 머지).
# ※한계: MR 라벨은 파이프라인 생성 시점에 읽힌다. 라벨을 나중에 붙였으면 새 파이프라인을 돌려야 잡이 생긴다.
#   한글 라벨의 RE2 매칭은 실 파이프라인 실측 전 — 첫 고위험 MR 에서 잡 생성을 눈으로 확인하라(/done 7단계).
high-risk-label-gate:
  extends: .peer-approval-gate
  variables:
    GATE_REASON: "MR 에 '고위험' 라벨이 붙어 있음(경로 목록과 무관)"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /고위험/'
      when: manual
      allow_failure: false

# 머지된 마이그레이션 불변 감시 — 삭제·수정이면 빨간불 (allow_failure 없음 = 차단형)
# ★왜: `git revert -m 1` 은 되돌리는 머지에 딸린 마이그레이션 폴더를 그냥 삭제한다(2026-08-06 리허설 실증).
#   CLAUDE.md '스키마·데이터'의 "main 에 머지된 파일은 불변"은 사람 규칙뿐이었고,
#   기본 도구의 기본 동작이 그 규칙을 깨는 쪽이라 사고가 조용히 지나간다(적용된 마이그레이션이 사라지면 드리프트).
# ★되돌리는 정해진 길 = 파일은 되살려 두고(git checkout <머지커밋> -- <폴더>) 역DDL 을 담은
#   '새 마이그레이션'을 추가한다 → 그러면 diff 에 A 만 남아 이 잡이 통과한다. (절차: _reference/revert.md B)
# ※의도적 예외 통로를 두지 않았다 — 예외가 필요하면 이 파일을 고쳐야 하고, 그 변경은 high-risk-gate 를 탄다.
# ※DB 없는 스택이면 DIR 경로가 없어 diff 0건 = 항상 통과(무해). 마이그레이션 도구 도입 시 DIR 만 치환하라.
migration-immutable:
  stage: test
  image: alpine:3
  variables:
    # 얕은 클론이면 대상 브랜치와의 merge base 가 없어 diff 가 성립하지 않는다.
    GIT_DEPTH: 0
  script:
    - apk add --no-cache git >/dev/null
    - |
      # 비교 기준은 MR 의 실제 대상 브랜치 — main 을 박아두면 다른 브랜치로 가는 MR을 엉뚱한 기준과 비교한다
      TARGET="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}"
      git fetch -q origin "$TARGET" || { echo "⛔ origin/$TARGET fetch 실패 — 비교 기준이 없어 판정 불가"; exit 1; }
      BASE=$(git merge-base HEAD "origin/$TARGET") || BASE=""
      # ★기준을 못 구하면 조용히 통과하지 않고 소리를 낸다 — 통과시키면 안전망이 필요한 순간에만 꺼진다
      if [ -z "$BASE" ]; then echo "⛔ merge base 를 못 구했다(GIT_DEPTH: 0 확인) — 판정 불가라 실패시킨다"; exit 1; fi
      DIR="db/migrations"               # 스택 마이그레이션 경로로 치환 (Prisma 폴더형이면 prisma/schema/migrations)
      # ★필터에 R(이름변경)을 반드시 포함한다 — 폴더명만 바꾸면 git 은 삭제로 보지 않고 R 로 기록해
      #   DM 만 볼 때 이름 변경이 100% 새어 나갔다(사본 실측). 마이그레이션은 이름이 곧 순번이다.
      HIT=$(git diff --diff-filter=DMR --name-only "$BASE" HEAD -- "$DIR" || true)
      if [ -n "$HIT" ]; then
        echo "⛔ 머지된 마이그레이션을 삭제·수정·이름변경했습니다 (CLAUDE.md '스키마·데이터' — 머지된 파일은 불변):"
        echo "$HIT"
        echo "   → 되돌리려면: git revert -m 1 --no-commit <머지커밋> 후"
        echo "     git checkout <머지커밋> -- $DIR/<되돌릴대상> 로 파일을 되살리고,"
        echo "     역DDL(DROP ... IF EXISTS 등 멱등)을 담은 새 마이그레이션을 추가하세요(_reference/revert.md B)."
        echo "   → 신규 추가(A)만 있으면 이 잡은 통과합니다. 마이그레이션 MR 은 고위험 = 경고 레인(AI 경고 리뷰 + 증적 3종)."
        exit 1
      fi
      ADD=$(git diff --diff-filter=A --name-only "$BASE" HEAD -- "$DIR" || true)
      N=$(echo "$ADD" | sed '/^$/d' | wc -l | tr -d ' ')
      echo "마이그레이션 삭제·수정·이름변경 없음 — OK (신규 추가 파일 ${N}건)"
  rules:
    # ★changes: 를 걸지 않는다 — changes 는 '새 브랜치 첫 푸시에서 무조건 참'이라
    #   조건부로 만들면 판정 유무가 브랜치 상태에 따라 흔들린다(_reference/ci-needs.md). 항상 돌게 둔다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# 비개발자(기획/디자이너) 직접 push 안전망
# CE엔 경로별 push 제한(CODEOWNERS·Push Rules)이 없어 '사후 감지'로 대체한다.
# 공통 개발자가 CI/CD Variables 에 PLANNER_EMAILS(기획/디자이너 이메일, 쉼표구분)를 등록하면 발효.
# 그 계정이 docs/·README 외(코드·CI·설정) 파일을 바꾸면 파이프라인 실패 → 되돌린다.
planner-guard:
  stage: test
  image: alpine:3
  variables:
    # 얕은 클론이면 push 범위(BEFORE..SHA)의 앞쪽 커밋이 없어 git log 가 실패한다 → 폴백으로 떨어져 감시 범위가 준다.
    GIT_DEPTH: 0
  script:
    - apk add --no-cache git >/dev/null
    - 'echo "author=$CI_COMMIT_AUTHOR"'
    - |
      if [ -z "$PLANNER_EMAILS" ]; then echo "PLANNER_EMAILS 미설정 — 감지 비활성(무해). 공통 개발자가 등록하면 발효"; exit 0; fi
      HIT=0
      for e in $(echo "$PLANNER_EMAILS" | tr ',' ' '); do
        case "$CI_COMMIT_AUTHOR" in *"<$e>"*) HIT=1;; esac
      done
      if [ "$HIT" != "1" ]; then echo "개발자 커밋 — 통과"; exit 0; fi
      # ★push 범위 전체를 본다 — 마지막 커밋 하나(git show $CI_COMMIT_SHA)만 보면
      #   커밋 2개를 한 번에 push했을 때 앞 커밋의 위반이 그대로 통과한다.
      CH=""
      ZERO="0000000000000000000000000000000000000000"
      if [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] && [ "$CI_COMMIT_BEFORE_SHA" != "$ZERO" ]; then
        CH=$({ git log --name-only --pretty=format: "$CI_COMMIT_BEFORE_SHA".."$CI_COMMIT_SHA" 2>/dev/null || true; } | sed '/^$/d' | sort -u)
      fi
      # 폴백 — 새 브랜치 첫 push는 BEFORE_SHA가 0으로 채워진 SHA다(MR 파이프라인도 동일). 그땐 종전대로 마지막 커밋만 본다.
      if [ -z "$CH" ]; then
        CH=$(git show --name-only --pretty=format: "$CI_COMMIT_SHA" | sed '/^$/d')
      fi
      echo "변경 파일:"; echo "$CH"
      BAD=$(echo "$CH" | grep -vE '^(docs/|README)' || true)
      if [ -n "$BAD" ]; then
        echo "⛔ 기획/디자이너 계정이 docs/·README 외 파일을 변경했습니다:"; echo "$BAD"
        echo "코드·CI·배포설정은 개발자만 변경합니다. 이 커밋을 되돌리세요(공통 개발자 문의)."
        exit 1
      fi
      echo "docs/ 내 변경만 — OK"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
